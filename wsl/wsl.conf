# Configuration de la distribution SDK-Manager.
[boot]
# Docker est un service systemd de la distribution.
systemd = true

[user]
default = sdk

[interop]
enabled = true
# Sans cela, le PATH de Windows est ajouté au PATH Linux : `docker` et `git` s'y
# résolvent alors vers les exécutables Windows, lents et hors de cet environnement.
appendWindowsPath = false

[automount]
# Les disques Windows restent accessibles sous /mnt : la migration d'un projet
# déjà présent sur C:\ en dépend.
enabled = true
options = "metadata"

[network]
generateResolvConf = true
