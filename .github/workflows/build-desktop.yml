name: Build desktop applications
run-name: "${{ github.event.head_commit.message || format('Build desktop applications — {0}', github.ref_name) }}"

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    needs: wsl-image
    runs-on: ${{ matrix.platform }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            artifact: odoo-manager-macos
            bundles: app,dmg
          - platform: ubuntu-22.04
            artifact: odoo-manager-linux-x64
            bundles: deb,appimage
          - platform: windows-latest
            artifact: odoo-manager-windows-x64
            bundles: nsis
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 5))
            done
            return 1
          }
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          retry sudo apt-get update
          retry sudo apt-get install -y --no-install-recommends libfuse2 libnss3 libgtk-3-0 libasound2 xvfb
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: odoo-manager-next/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install frontend and Electron dependencies
        working-directory: odoo-manager-next
        run: npm ci
      - name: Install sidecar builder
        run: python -m pip install pyinstaller
      - name: Download the Linux runtime embedded in the Windows installer
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v7
        with:
          name: sdk-manager-linux-runtime
          path: odoo-manager-next/electron/binaries
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Build native backend and Electron installer
        env:
          CI: "true"
        run: python scripts/build_desktop.py --bundles ${{ matrix.bundles }}
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: python scripts/smoke_test_electron.py --bundle-directory odoo-manager-next/release
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_test_electron.py --bundle-directory odoo-manager-next/release
      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            odoo-manager-next/release/*.dmg
            odoo-manager-next/release/*.deb
            odoo-manager-next/release/*.AppImage
            odoo-manager-next/release/*.exe
          retention-days: 1
          if-no-files-found: error

  wsl-image:
    name: sdk-manager-linux-runtime
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the distribution contents
        run: python -m unittest tests.test_wsl_image -v
      - name: Build the WSL distribution image
        run: python scripts/build_wsl_image.py
      - name: Check the built image
        run: |
          set -euxo pipefail
          version=$(python -c "import json,pathlib;print(json.loads(pathlib.Path('odoo-manager-next/package.json').read_text())['version'])")
          archive="dist/wsl/sdk-manager-${version}.wsl"
          (cd dist/wsl && sha256sum -c "sdk-manager-${version}.wsl.sha256")
          # Le noyau WSL manque au runner : le contenu est vérifié dans l'archive elle-même.
          tar -tf "$archive" etc/wsl.conf etc/docker/daemon.json opt/sdk-manager/provision.sh usr/bin/dockerd usr/bin/git > /dev/null
          tar -xOf "$archive" etc/sdk-manager-release | grep -Fx "$version"
          tar -xOf "$archive" etc/wsl.conf | grep -F "systemd = true"
      - name: Build the Linux backend that runs inside the distribution
        run: |
          set -euxo pipefail
          python -m pip install pyinstaller
          python scripts/build_electron_sidecar.py --clean
      - name: Lay out the runtime as the Windows installer expects it
        run: |
          set -euxo pipefail
          mkdir -p runtime/wsl runtime/backend-linux
          cp dist/wsl/*.wsl dist/wsl/*.sha256 runtime/wsl/
          cp odoo-manager-next/electron/binaries/odoo-manager-backend runtime/backend-linux/
      - name: Upload the Linux runtime
        uses: actions/upload-artifact@v6
        with:
          name: sdk-manager-linux-runtime
          path: runtime/**
          retention-days: 1
          if-no-files-found: error
