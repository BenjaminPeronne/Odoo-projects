name: Build desktop applications

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_SIGNING_REQUIRED: ${{ vars.RELEASE_SIGNING_REQUIRED }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            artifact: odoo-manager-macos
            bundles: app,dmg
          - platform: ubuntu-22.04
            artifact: odoo-manager-linux-x64
            bundles: deb,appimage
          - platform: windows-latest
            artifact: odoo-manager-windows-x64
            bundles: nsis

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail

          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            return 1
          }

          retry sudo apt-get update

          FUSE_PACKAGE=libfuse2
          if ! apt-cache show "$FUSE_PACKAGE" >/dev/null 2>&1; then
            FUSE_PACKAGE=libfuse2t64
          fi

          retry sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            "$FUSE_PACKAGE"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: odoo-manager-next/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: odoo-manager-next/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: odoo-manager-next
        run: npm ci

      - name: Install sidecar builder
        run: python -m pip install pyinstaller

      - name: Run backend tests
        run: python -m unittest discover -s tests -v

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            message="Signature macOS désactivée. Secrets absents: ${missing[*]}"
            if [ "${RELEASE_SIGNING_REQUIRED:-false}" = "true" ]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::warning::$message"
            echo "### macOS" >> "$GITHUB_STEP_SUMMARY"
            echo "Build ad hoc non notarizé. Configurez les secrets Apple avant distribution." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/odoo-manager-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | head -n 1)"
          if [ -z "$signing_identity" ]; then
            echo "::error::Le certificat importé ne contient aucune identité Developer ID Application valide."
            exit 1
          fi

          write_github_env() {
            local name="$1"
            local value="$2"
            local delimiter
            delimiter="ODOO_MANAGER_$(openssl rand -hex 16)"
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_ENV"
          }

          rm -f "$certificate_path"
          write_github_env APPLE_SIGNING_IDENTITY "$signing_identity"
          write_github_env APPLE_ID "$APPLE_ID"
          write_github_env APPLE_PASSWORD "$APPLE_PASSWORD"
          write_github_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
          echo "MACOS_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          echo "### macOS" >> "$GITHUB_STEP_SUMMARY"
          echo "Signature Developer ID et notarisation activées." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Windows Authenticode signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { $missing += "WINDOWS_CERTIFICATE" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { $missing += "WINDOWS_CERTIFICATE_PASSWORD" }

          if ($missing.Count -gt 0) {
            $message = "Signature Windows désactivée. Secrets absents: $($missing -join ', ')"
            if ($env:RELEASE_SIGNING_REQUIRED -eq "true") {
              Write-Output "::error::$message"
              exit 1
            }
            Write-Output "::warning::$message"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Build Authenticode non signé. Configurez le certificat avant distribution."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "odoo-manager-certificate.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $securePassword = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -Force `
            -AsPlainText
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password $securePassword
          Remove-Item -Force $certificatePath

          if (-not $certificate -or -not $certificate.HasPrivateKey) {
            throw "Le certificat Windows importé ne contient pas de clé privée."
          }

          $timestampUrl = $env:WINDOWS_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = "http://timestamp.digicert.com"
          }
          $configPath = Join-Path $env:RUNNER_TEMP "tauri-windows-signing.json"
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $timestampUrl
              }
            }
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $configPath

          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_EXTRA_CONFIG=$configPath"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_SIGNING_CONFIGURED=true"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Signature Authenticode activée."

      - name: Build native sidecar and Tauri installer
        env:
          CI: "true"
        run: python scripts/build_desktop.py --bundles ${{ matrix.bundles }}

      - name: Verify signed macOS packages
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="odoo-manager-next/src-tauri/target/release/bundle"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find "$bundle_dir/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Verify signed Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "odoo-manager-next/src-tauri/target/release/bundle/nsis/*.exe" `
            | Sort-Object LastWriteTime `
            | Select-Object -Last 1
          if (-not $installer) {
            throw "Installateur NSIS introuvable."
          }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") {
            throw "Signature Authenticode invalide: $($signature.Status) - $($signature.StatusMessage)"
          }
          Write-Output "Signature Authenticode valide: $($signature.SignerCertificate.Subject)"

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: odoo-manager-next/src-tauri/target/release/bundle/**
          if-no-files-found: error
