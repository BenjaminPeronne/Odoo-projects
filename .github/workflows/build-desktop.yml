name: Build desktop applications
run-name: "${{ github.event.head_commit.message || format('Build desktop applications — {0}', github.ref_name) }}"

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            artifact: odoo-manager-macos
            bundles: app,dmg
          - platform: ubuntu-22.04
            artifact: odoo-manager-linux-x64
            bundles: deb,appimage
          - platform: windows-latest
            artifact: odoo-manager-windows-x64
            bundles: nsis
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              sleep $((attempt * 5))
            done
            return 1
          }
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          retry sudo apt-get update
          retry sudo apt-get install -y --no-install-recommends libfuse2 libnss3 libgtk-3-0 libasound2 xvfb
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: odoo-manager-next/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install frontend and Electron dependencies
        working-directory: odoo-manager-next
        run: npm ci
      - name: Install sidecar builder
        run: python -m pip install pyinstaller
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Build native backend and Electron installer
        env:
          CI: "true"
        run: python scripts/build_desktop.py --bundles ${{ matrix.bundles }}
      - name: Smoke test packaged macOS app
        if: runner.os == 'macOS'
        run: python scripts/smoke_test_electron.py --bundle-directory odoo-manager-next/release
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_test_electron.py --bundle-directory odoo-manager-next/release
      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            odoo-manager-next/release/*.dmg
            odoo-manager-next/release/*.deb
            odoo-manager-next/release/*.AppImage
            odoo-manager-next/release/*.exe
          retention-days: 1
          if-no-files-found: error
