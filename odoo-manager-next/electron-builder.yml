appId: com.sudokeys.odoo-manager
productName: SDK Local Manager
artifactName: SDK-Local-Manager-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: electron/icons
files:
  - out/**/*
  - electron/*.cjs
  - electron/icons/*
  - package.json
  - '!node_modules/**/*'
extraResources:
  - from: electron/binaries
    to: backend
  # Environnement Linux embarqué sous Windows : image de la distribution et backend
  # Linux qui y tourne. Les dossiers existent toujours (build_desktop.py), même vides :
  # l'application dit alors que l'image manque au lieu d'échouer au démarrage.
  - from: electron/binaries/wsl
    to: wsl
  - from: electron/binaries/backend-linux
    to: backend-linux
asar: true
npmRebuild: false
afterPack: electron/after-pack.cjs
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  icon: electron/icons/icon.icns
  identity: '-'
  timestamp: none
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target: [nsis]
  icon: electron/icons/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
linux:
  target: [AppImage, deb]
  icon: electron/icons/128x128@2x.png
  category: Development
  maintainer: Sudokeys
  syncDesktopName: true
